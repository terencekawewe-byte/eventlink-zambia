<div class="modal fade lightbox" id="imageLightbox" tabindex="-1" aria-label="Image preview" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="lightbox-bar">
        <span class="lightbox-counter"></span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close image preview"></button>
      </div>
      <div class="lightbox-stage">
        <button class="lightbox-nav lightbox-prev" type="button" data-lightbox-step="-1" aria-label="Previous image"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
        <img class="lightbox-image" alt="">
        <button class="lightbox-nav lightbox-next" type="button" data-lightbox-step="1" aria-label="Next image"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
      </div>
      <p class="lightbox-caption"></p>
    </div>
  </div>
</div>
